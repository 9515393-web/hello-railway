<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/portal/mobile.css">

<title>Статистика опроса — Захожье</title>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f5f7fb;
}

.header{
text-align:center;
padding:40px;
background:#2a5bd7;
color:white;
}

.container{
max-width:1000px;
margin:auto;
padding:40px;
}

.stats-grid{
display:grid;
grid-template-columns:1fr;
gap:20px;
margin-bottom:40px;
max-width:360px;
margin-left:auto;
margin-right:auto;
}

.stat-card{
background:white;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

.stat-number{
font-size:34px;
font-weight:bold;
margin-top:10px;
}

@media(max-width:700px){

.stats-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

<h1>Статистика опроса жителей</h1>
<p>Проект восстановления деревни Захожье</p>

</div>

<div class="container">

<div class="stats-grid">

<div class="stat-card">
Участвовали в опросе
<div class="stat-number" id="total">—</div>
</div>

</div>

</div>

<div class="bottom-home">

<a href="/" class="home-btn">
🏠 Вернуться в главное меню
</a>

</div>

<script>
fetch("/api/stats")
  .then(function(response) {
    return response.json();
  })
  .then(function(data) {
    console.log("STATS DATA:", data);

    if (data.error) {
      console.error("API error:", data);
      document.getElementById("total").innerText = "Ошибка";
      return;
    }

    document.getElementById("total").innerText = data.participants ?? 0;
  })
  .catch(function(error) {
    console.error("Ошибка загрузки статистики:", error);
    document.getElementById("total").innerText = "Ошибка";
  });
</script>

</body>
</html>
