<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/portal/mobile.css">

<title>Статистика опроса — Захожье</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f5f7fb;
}

.header{
text-align:center;
padding:40px;
background:#2a5bd7;
color:white;
}

.container{
max-width:1000px;
margin:auto;
padding:40px;
}

.stats-grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:40px;

}

.stat-card{

background:white;
padding:25px;
border-radius:12px;
text-align:center;
box-shadow:0 6px 16px rgba(0,0,0,0.08);

}

.stat-number{
font-size:34px;
font-weight:bold;
margin-top:10px;
}

.chart-container{
max-width:600px;
margin:auto;
}

@media(max-width:700px){

.stats-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div class="header">

<h1>Статистика опроса жителей</h1>
<p>Проект восстановления деревни Захожье</p>

</div>

<div class="container">

<div class="stats-grid single-stat">

<div class="stat-card">
Участвовали в опросе
<div class="stat-number" id="total">—</div>
</div>

</div>

<div class="chart-container">
<canvas id="chart"></canvas>
</div>

</div>

<script>
fetch("/api/stats")
  .then(res => res.json())
  .then(data => {
    if (data.error) {
      console.error(data.details || data.error);

      document.getElementById("total").innerText = "Ошибка";
      document.getElementById("support").innerText = "—";
      document.getElementById("other").innerText = "—";
      return;
    }

    const total = data.participants ?? 0;
    const support = data.support_yes ?? 0;
    const other = data.support_no ?? 0;

    document.getElementById("total").innerText = total;
    document.getElementById("support").innerText = support;
    document.getElementById("other").innerText = other;

    const ctx = document.getElementById("chart");

    new Chart(ctx, {
      type: "pie",
      data: {
        labels: [
          "Отмечены как участвовавшие",
          "Не отмечены"
        ],
        datasets: [{
          data: [support, other],
          backgroundColor: [
            "#2a5bd7",
            "#cccccc"
          ]
        }]
      }
    });
  })
  .catch(error => {
    console.error("Ошибка загрузки статистики:", error);

    document.getElementById("total").innerText = "Ошибка";
    document.getElementById("support").innerText = "—";
    document.getElementById("other").innerText = "—";
  });
</script>

</div>

<div class="bottom-home">

<a href="/" class="home-btn">
🏠 Вернуться в главное меню
</a>

</div>

</div>

</body>
</html>
